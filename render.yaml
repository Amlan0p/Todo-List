# Render Blueprint: one web service serves both the frontend and API,
# plus a managed PostgreSQL database. The browser can use relative API paths,
# so there is no backend URL placeholder to edit after deployment.
services:
  - type: web
    name: todos-app
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: todos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  - name: todos-db
    databaseName: todos
    user: todos
    plan: free
