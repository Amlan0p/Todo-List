<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In · To-Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card glass-panel">
      <div class="auth-brand">
        <span class="dot"></span>
        <span>To-Do List</span>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to pull your file from the drawer.</p>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm" novalidate>
        <div class="form-group" id="emailGroup">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-error">Please enter a valid email address.</span>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <span class="field-error">Password is required.</span>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-label">Log In</span>
        </button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
